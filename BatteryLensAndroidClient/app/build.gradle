plugins {
    id "com.android.application"
}

android {
    namespace "com.batterylens.client"
    compileSdk 35

    defaultConfig {
        applicationId "com.batterylens.client"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
}
