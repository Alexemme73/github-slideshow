name: Temporary TubeMusic APK Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout TubeMusic branch
        uses: actions/checkout@v4
        with:
          ref: tubemusic-build
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Unpack TubeMusic
        run: |
          rm -rf TubeMusic
          mkdir -p TubeMusic
          unzip -q TubeMusic_source.zip -d TubeMusic
      - name: Build debug APK
        working-directory: TubeMusic
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp TubeMusic/app/build/outputs/apk/debug/app-debug.apk TubeMusic-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TubeMusic-debug-apk
          path: TubeMusic-debug.apk
          if-no-files-found: error
