name: Build BatteryLens Android APK

on:
  push:
    branches:
      - batterylens-android-client
    paths:
      - "BatteryLensAndroidClient/**"
      - ".github/workflows/build-batterylens-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BatteryLensAndroidClient

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build installable debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/BatteryLensClient.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BatteryLensClient-APK
          path: BatteryLensAndroidClient/out/BatteryLensClient.apk
          if-no-files-found: error
