name: Export JADX for BlinkViewer 55.6

on:
  push:
    branches: [ "blinkviewer-build-56" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download JADX 1.5.6
        shell: bash
        run: |
          curl -L --fail --retry 3 -o jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip
          unzip -t jadx.zip
      - name: Upload JADX
        uses: actions/upload-artifact@v4
        with:
          name: jadx-1.5.6
          path: jadx.zip
          if-no-files-found: error
          retention-days: 1
