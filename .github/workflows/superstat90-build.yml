name: Build SuperStat90 APK

on:
  push:
    branches: [ "superstat90-android" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Rebuild source
        shell: bash
        run: |
          rm -rf SuperStat90Android SuperStat90Android_source.zip
          cat superstat90_b64/part_* | base64 -d > SuperStat90Android_source.zip
          unzip -q SuperStat90Android_source.zip
      - name: Build debug APK
        working-directory: SuperStat90Android
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Prepare artifact
        run: cp SuperStat90Android/app/build/outputs/apk/debug/app-debug.apk SuperStat90-v1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SuperStat90-APK
          path: SuperStat90-v1.0.apk
          if-no-files-found: error
