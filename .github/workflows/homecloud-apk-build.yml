name: HomeCloud APK Build

on:
  push:
    branches:
      - homecloud-apk-v1-1-0-build
    paths:
      - .github/workflows/homecloud-apk-build.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Android source
        shell: bash
        run: |
          mkdir -p homecloud-src
          base64 -d homecloud-build/HomeCloudBackup_Android_Source_v1.1.0.b64 > /tmp/homecloud.zip
          unzip -q /tmp/homecloud.zip -d homecloud-src

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Build debug APK
        shell: bash
        run: |
          cd homecloud-src/android
          gradle --no-daemon clean assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/HomeCloudBackup-v1.1.0-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HomeCloudBackup-v1.1.0-debug
          path: HomeCloudBackup-v1.1.0-debug.apk
          if-no-files-found: error
          retention-days: 1
