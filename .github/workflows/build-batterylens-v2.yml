name: Build BatteryLens Android v2

on:
  push:
    branches: [ main ]
    paths:
      - "BatteryLensAndroidClient_v2_source.b64"
      - ".github/workflows/build-batterylens-v2.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "BatteryLensAndroidClient_v2_source.b64"
      - ".github/workflows/build-batterylens-v2.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Decode source
        run: |
          base64 -d BatteryLensAndroidClient_v2_source.b64 > BatteryLensAndroidClient_v2_source.zip
          unzip -o BatteryLensAndroidClient_v2_source.zip
      - name: Build APK
        working-directory: BatteryLensAndroidClient_v2
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: |
          mkdir -p out
          cp BatteryLensAndroidClient_v2/app/build/outputs/apk/debug/app-debug.apk out/BatteryLensClient_v2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BatteryLensClient-v2-APK
          path: out/BatteryLensClient_v2.apk
          if-no-files-found: error
