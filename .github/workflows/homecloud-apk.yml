name: Build HomeCloud APK
on:
  push:
    branches:
      - homecloud-apk-build-v1.1.0
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Android source
        run: |
          base64 -d homecloud_android_source.b64 > source.zip
          mkdir project
          unzip -q source.zip -d project
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Build APK
        working-directory: project/android
        run: gradle --no-daemon clean assembleDebug
      - name: Rename APK
        run: cp project/android/app/build/outputs/apk/debug/app-debug.apk HomeCloudBackup-v1.1.0-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HomeCloudBackup-v1.1.0-debug
          path: HomeCloudBackup-v1.1.0-debug.apk
          if-no-files-found: error
