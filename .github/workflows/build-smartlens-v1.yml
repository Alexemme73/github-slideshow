name: Build SmartLens V1.0

on:
  push:
    branches:
      - smartlens-v1.0
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore Android source
        working-directory: SmartLens_V1.0
        run: |
          python -c "import base64,zipfile,io,pathlib; raw=base64.b64decode(pathlib.Path('android.zip.b64').read_text()); zipfile.ZipFile(io.BytesIO(raw)).extractall('android')"
      - name: Build APK
        working-directory: SmartLens_V1.0/android
        run: gradle --no-daemon assembleDebug
      - name: Prepare APK
        working-directory: SmartLens_V1.0/android
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/SmartLens_V1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SmartLens_V1.0_APK
          path: SmartLens_V1.0/android/out/SmartLens_V1.0.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Restore Manager source
        working-directory: SmartLens_V1.0
        shell: pwsh
        run: |
          python -c "import base64,lzma,pathlib; pathlib.Path('SmartLens_V1.0_Manager.pyw').write_bytes(lzma.decompress(base64.b64decode(pathlib.Path('manager.pyw.xz.b64').read_text())))"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build Server Manager EXE
        working-directory: SmartLens_V1.0
        run: pyinstaller --noconfirm --clean --onefile --windowed --name SmartLens_V1.0_Server SmartLens_V1.0_Manager.pyw
      - uses: actions/upload-artifact@v4
        with:
          name: SmartLens_V1.0_Server_EXE
          path: SmartLens_V1.0/dist/SmartLens_V1.0_Server.exe
