name: BlinkViewer Android Tools

on:
  push:
    branches: [ "blinkviewer-build-55" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35 build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Pack tools
        shell: bash
        run: |
          mkdir -p android-tools/platforms/android-35 android-tools/build-tools
          cp "$ANDROID_HOME/platforms/android-35/android.jar" android-tools/platforms/android-35/android.jar
          cp -a "$ANDROID_HOME/build-tools/35.0.0" android-tools/build-tools/35.0.0
      - name: Upload tools
        uses: actions/upload-artifact@v4
        with:
          name: blinkviewer-android35-tools
          path: android-tools
          if-no-files-found: error
          retention-days: 1
